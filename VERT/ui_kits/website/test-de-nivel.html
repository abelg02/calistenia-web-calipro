<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test de nivel · VÉRTEX</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="cinematic.css">
<style>
.quiz{max-width:640px;margin:0 auto;padding:200px var(--gutter) 160px}
.q-progress{display:flex;gap:6px;margin-bottom:48px}
.q-progress span{flex:1;height:2px;background:var(--line)}
.q-progress span.done{background:var(--ember)}
.q-step{display:none}
.q-step.active{display:block}
.q-num{font-family:var(--font-mono);font-size:11px;letter-spacing:.24em;color:var(--fg-muted);text-transform:uppercase;margin-bottom:24px}
.q-title{font-family:var(--font-display);font-style:italic;font-size:clamp(1.75rem,4vw,2.5rem);color:var(--fg-strong);line-height:1.1;margin-bottom:40px;max-width:18ch}
.q-opts{display:flex;flex-direction:column;gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.q-opt{background:var(--bg);padding:22px 24px;text-align:left;border:0;color:var(--fg);font-family:var(--font-body);font-size:1.0625rem;cursor:pointer;transition:background var(--dur) var(--ease);display:flex;justify-content:space-between;align-items:center}
.q-opt:hover{background:var(--bg-elev);color:var(--fg-strong)}
.q-result{display:none}
.q-result.active{display:block}
.result-code{font-family:var(--font-mono);font-size:12px;letter-spacing:.24em;color:var(--ember);text-transform:uppercase;margin-bottom:24px}
.result-name{font-family:var(--font-display);font-style:italic;font-size:clamp(2.5rem,6vw,4rem);color:var(--fg-strong);line-height:1;margin-bottom:32px}
.result-body{color:var(--fg-muted);font-size:1.0625rem;line-height:1.6;max-width:52ch;margin-bottom:40px}
.result-img{aspect-ratio:16/9;background:var(--ink-2) center/cover no-repeat;filter:grayscale(.5) contrast(1.05);margin-bottom:40px}
</style>
</head>
<body>
<div id="vx-nav"></div>

<div class="quiz">
  <div class="q-progress" id="qProgress"></div>

  <div class="q-step active" data-step="0">
    <div class="q-num">Test de nivel · 01 / 03</div>
    <div class="q-title">¿Cuántas dominadas estrictas haces seguidas<span class="dot">.</span></div>
    <div class="q-opts">
      <button class="q-opt" data-val="0">Menos de 5<span>→</span></button>
      <button class="q-opt" data-val="1">Entre 5 y 10<span>→</span></button>
      <button class="q-opt" data-val="2">Entre 10 y 15<span>→</span></button>
      <button class="q-opt" data-val="3">Más de 15<span>→</span></button>
    </div>
  </div>

  <div class="q-step" data-step="1">
    <div class="q-num">Test de nivel · 02 / 03</div>
    <div class="q-title">¿Cuánto tiempo aguantas un pino libre a dos manos<span class="dot">.</span></div>
    <div class="q-opts">
      <button class="q-opt" data-val="0">No puedo hacerlo aún<span>→</span></button>
      <button class="q-opt" data-val="1">Menos de 20 segundos<span>→</span></button>
      <button class="q-opt" data-val="2">20 a 60 segundos<span>→</span></button>
      <button class="q-opt" data-val="3">Más de 60 segundos<span>→</span></button>
    </div>
  </div>

  <div class="q-step" data-step="2">
    <div class="q-num">Test de nivel · 03 / 03</div>
    <div class="q-title">¿Cuántos meses llevas entrenando calistenia de forma constante<span class="dot">.</span></div>
    <div class="q-opts">
      <button class="q-opt" data-val="0">Menos de 3 meses<span>→</span></button>
      <button class="q-opt" data-val="1">3 a 12 meses<span>→</span></button>
      <button class="q-opt" data-val="2">1 a 3 años<span>→</span></button>
      <button class="q-opt" data-val="3">Más de 3 años<span>→</span></button>
    </div>
  </div>

  <div class="q-result" id="qResult">
    <div class="result-img" id="rImg"></div>
    <div class="result-code" id="rCode"></div>
    <div class="result-name" id="rName"></div>
    <div class="result-body" id="rBody"></div>
    <div style="display:flex;gap:14px">
      <a href="#" id="rLink" class="btn btn-primary">Ver la ruta completa</a>
      <button class="btn btn-ghost" onclick="location.reload()">Repetir test</button>
    </div>
  </div>
</div>

<div id="vx-footer"></div>
<script src="shared.js"></script>
<script>
  const results = [
    { min:0, code:'HFL-04 · Intermedio', name:'Empieza por Human Flag.', body:'Con tu base actual, Human Flag es la puerta de entrada ideal: exige fuerza oblicua y de agarre, pero no requiere aún el volumen de tracción de un Front Lever o Planche. 6 a 14 meses bien invertidos.', img:'https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=1200&q=80', href:'skills/human-flag.html' },
    { min:4, code:'FLV-03 · Avanzado', name:'Front Lever es tu siguiente paso.', body:'Tienes base de tracción suficiente para empezar Tuck Front Lever con seguridad. Con constancia, el Front Lever completo está entre 9 y 18 meses de ti.', img:'https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?auto=format&fit=crop&w=1200&q=80', href:'skills/front-lever.html' },
    { min:7, code:'OAH-01 / PLN-02 · Élite', name:'Estás listo para One Arm Handstand o Planche.', body:'Tu base de fuerza y equilibrio ya soporta el trabajo de las dos skills más exigentes del repertorio. Elige la que más te llame: ambas rondan los 18 a 36 meses.', img:'https://images.unsplash.com/photo-1599058917212-d750089bc07e?auto=format&fit=crop&w=1200&q=80', href:'skills/one-arm-handstand.html' }
  ];
  let score = 0, step = 0;
  const steps = [...document.querySelectorAll('.q-step')];
  const progress = document.getElementById('qProgress');
  steps.forEach(() => progress.innerHTML += '<span></span>');
  const bars = [...progress.children];

  steps.forEach(s => {
    s.querySelectorAll('.q-opt').forEach(btn => {
      btn.addEventListener('click', () => {
        score += parseInt(btn.dataset.val, 10);
        bars[step].classList.add('done');
        s.classList.remove('active');
        step++;
        if (step < steps.length) { steps[step].classList.add('active'); }
        else showResult();
      });
    });
  });

  function showResult() {
    const r = [...results].reverse().find(x => score >= x.min) || results[0];
    document.getElementById('qResult').classList.add('active');
    document.getElementById('rCode').textContent = r.code;
    document.getElementById('rName').textContent = r.name;
    document.getElementById('rBody').textContent = r.body;
    document.getElementById('rImg').style.backgroundImage = `url('${r.img}')`;
    document.getElementById('rLink').href = r.href;
  }
</script>
</body></html>
