<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacto · VÉRTEX</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="cinematic.css">
</head>
<body data-active="contacto">
<div id="vx-nav"></div>
<header class="page-hero grain">
  <div class="container" style="padding:0">
    <div class="num">Contacto · respuesta en 48 h</div>
    <h1 data-words>Escríbenos<span class="dot">.</span></h1>
    <p>Dudas sobre el método, colaboraciones, prensa o pedidos especiales. Leemos cada mensaje.</p>
  </div>
</header>

<section class="section">
  <div class="container">
    <div class="contact-grid">
      <div>
        <span class="t-eyebrow">Canales directos</span>
        <h2 data-words style="margin:24px 0 32px">Tres formas<span class="dot">.</span></h2>
        <div class="ch">
          <div class="ch-item"><span class="l">Correo</span><span class="v">hola@vertex.training</span></div>
          <div class="ch-item"><span class="l">Estudio</span><span class="v">Calle del Pez 14, Madrid</span></div>
          <div class="ch-item"><span class="l">Horario</span><span class="v">Lun – Vie · 09:00 – 19:00</span></div>
          <div class="ch-item"><span class="l">Prensa</span><span class="v">prensa@vertex.training</span></div>
        </div>
      </div>
      <form class="form" onsubmit="event.preventDefault();this.querySelector('button').textContent='Enviado.'">
        <div class="field half"><label>Nombre</label><input type="text" placeholder="Tu nombre"></div>
        <div class="field half"><label>Correo</label><input type="email" placeholder="tu@correo.com"></div>
        <div class="field"><label>Asunto</label>
          <select><option>Información del método</option><option>Prensa y colaboraciones</option><option>Pedidos de tienda</option><option>Otro</option></select>
        </div>
        <div class="field"><label>Mensaje</label><textarea placeholder="Cuéntanos brevemente."></textarea></div>
        <div class="submit"><button type="submit" class="btn btn-primary">Enviar mensaje</button></div>
      </form>
    </div>
  </div>
</section>

<div id="vx-footer"></div>
<script src="shared.js"></script>
</body></html>
