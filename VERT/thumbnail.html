<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="styles.css">
<style>
*{margin:0;box-sizing:border-box}
body{width:1280px;height:854px;display:flex;overflow:hidden;font-family:var(--font-body)}
.main{flex:1;background:var(--ink);display:flex;align-items:center;justify-content:center}
.mark{font-family:var(--font-display);font-style:italic;font-size:150px;line-height:1;letter-spacing:-0.02em;color:var(--fg-strong)}
.mark .dot{color:var(--ember)}
.strip{width:120px;display:flex;flex-direction:column}
.strip div{flex:1}
</style></head><body>
<div class="main"><div class="mark">VÉRTEX<span class="dot">.</span></div></div>
<div class="strip">
  <div style="background:#E0D8C8"></div>
  <div style="background:#C2553A"></div>
  <div style="background:#16140F"></div>
  <div style="background:#0E0D0B"></div>
</div>
</body></html>
