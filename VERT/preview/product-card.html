<!DOCTYPE html>
<!-- @dsCard group="Components" name="Product card" subtitle="Luxury minimal · no add-to-cart" viewport="700x280" --><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{padding:0;background:var(--bone);min-height:160px;display:flex;align-items:center;padding:24px;gap:32px;flex-wrap:wrap;color:#1a1a1a}
.product{cursor:pointer;width:160px}
.img{aspect-ratio:4/5;background:#E0D8C8 center/cover no-repeat;filter:grayscale(.5);margin-bottom:14px}
.row{display:flex;justify-content:space-between;align-items:baseline}
.name{font-size:13px;color:#0E0D0B}
.price{font-family:var(--font-mono);font-size:12px;color:var(--ash-2)}
.cat-tag{font-family:var(--font-mono);font-size:9px;letter-spacing:.18em;color:var(--ash-2);text-transform:uppercase;margin-top:4px}
</style></head><body>
<div class="product">
  <div class="img" style="background-image:url('https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=400&q=80')"></div>
  <div class="row"><span class="name">Hoodie · Carbon</span><span class="price">€ 145</span></div>
  <div class="cat-tag">Algodón 480 g</div>
</div>
<div class="product">
  <div class="img" style="background-image:url('https://images.unsplash.com/photo-1517438322307-e67111335449?auto=format&fit=crop&w=400&q=80')"></div>
  <div class="row"><span class="name">Grips · Tan</span><span class="price">€ 42</span></div>
  <div class="cat-tag">Cuero curtido</div>
</div>
</body></html>
