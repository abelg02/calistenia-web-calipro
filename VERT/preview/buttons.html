<!DOCTYPE html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Primary, ghost, pill" viewport="700x160" --><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{padding:32px;background:var(--ink);min-height:140px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;padding:18px 28px;font-family:var(--font-body);font-size:14px;font-weight:500;border:1px solid transparent;border-radius:2px;cursor:pointer;transition:all .4s cubic-bezier(.22,1,.36,1)}
.p{background:#F1ECE2;color:#0E0D0B}
.p:hover{background:#C2553A;color:#F1ECE2}
.g{background:transparent;color:#F1ECE2;border-color:oklch(28% 0.006 50)}
.g:hover{border-color:#F1ECE2}
.pill{padding:10px 18px;border:1px solid oklch(28% 0.006 50);border-radius:999px;font-size:13px;color:#F1ECE2;font-family:var(--font-body)}
</style></head><body>
<button class="btn p">Explorar skills</button>
<button class="btn g">Cómo entrenamos</button>
<a class="pill">Empezar</a>
</body></html>
