<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Text colors" subtitle="Mist, Ash, Line — text and hairlines" viewport="700x200" --><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{padding:24px;background:var(--ink);min-height:120px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:18px}
.row b{font-family:var(--font-mono);font-size:10px;letter-spacing:.18em;color:var(--mist-2);text-transform:uppercase;width:84px}
.bar{flex:1;height:24px;border-radius:2px;display:flex;align-items:center;padding:0 10px;font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;color:rgba(0,0,0,.7)}
</style></head><body>
<div class="row"><b>Mist</b><div class="bar" style="background:oklch(72% 0.005 60);color:#1a1a1a">Body on ink</div></div>
<div class="row"><b>Mist-2</b><div class="bar" style="background:oklch(55% 0.006 60);color:#fff">Secondary text on ink</div></div>
<div class="row"><b>Ash</b><div class="bar" style="background:oklch(35% 0.008 60);color:#fff">Body on bone</div></div>
<div class="row"><b>Line</b><div class="bar" style="background:oklch(28% 0.006 50);color:#fff">Hairline · 1px only</div></div>
</body></html>
