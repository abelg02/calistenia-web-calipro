<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="8px base · cinematic 192 between sections" viewport="700x260" --><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{padding:24px;background:var(--ink);min-height:140px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:14px;font-family:var(--font-mono);font-size:11px;color:var(--mist);letter-spacing:.08em}
.b{height:14px;background:var(--ember);border-radius:1px}
.l{width:54px;color:var(--mist-2);text-transform:uppercase;letter-spacing:.18em;font-size:10px}
</style></head><body>
<div class="row"><span class="l">4</span><div class="b" style="width:4px"></div><span>4 px · micro</span></div>
<div class="row"><span class="l">8</span><div class="b" style="width:8px"></div><span>8 px · base</span></div>
<div class="row"><span class="l">16</span><div class="b" style="width:16px"></div><span>16 · field gap</span></div>
<div class="row"><span class="l">32</span><div class="b" style="width:32px"></div><span>32 · within section</span></div>
<div class="row"><span class="l">96</span><div class="b" style="width:96px"></div><span>96 · between</span></div>
<div class="row"><span class="l">192</span><div class="b" style="width:192px"></div><span>192 · cinematic section padding</span></div>
</body></html>
