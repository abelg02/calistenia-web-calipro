<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Motion tokens" subtitle="Easing, durations, banned motion" viewport="700x220" --><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
