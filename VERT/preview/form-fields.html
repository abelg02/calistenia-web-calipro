<!DOCTYPE html>
<!-- @dsCard group="Components" name="Form fields" subtitle="Hairline-only inputs · ember focus" viewport="700x200" --><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{padding:24px;background:var(--bone);min-height:140px;display:flex;flex-direction:column;gap:18px;color:#1a1a1a}
.field{display:flex;flex-direction:column}
.field label{font-family:var(--font-mono);font-size:10px;letter-spacing:.18em;color:var(--ash-2);text-transform:uppercase;margin-bottom:10px}
.field input{background:transparent;border:0;border-bottom:1px solid var(--bone-3);padding:6px 0;font-family:var(--font-body);font-size:16px;color:#1a1a1a;outline:none;transition:border-color .4s cubic-bezier(.22,1,.36,1)}
.field input.f{border-color:#C2553A}
</style></head><body>
<div class="field"><label>Correo</label><input value="hola@vertex.training"></div>
<div class="field"><label>Asunto · activo</label><input class="f" value="Información del método"></div>
</body></html>
