<!DOCTYPE html>
<!-- @dsCard group="Type" name="Type scale" subtitle="H2, H3, body, mono — in order" viewport="700x260" --><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{padding:28px;background:var(--bone);color:var(--ash);min-height:120px}
.row{display:flex;flex-direction:column;gap:14px}
.line{display:flex;align-items:baseline;gap:24px;border-bottom:1px solid var(--bone-3);padding-bottom:10px}
.line:last-child{border:0}
.line span:first-child{font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;color:var(--ash-2);text-transform:uppercase;width:90px}
.line span:last-child{color:oklch(20% 0.008 60)}
.h2{font-family:var(--font-display);font-style:italic;font-size:36px;line-height:1}
.h3{font-size:18px}
.body{font-size:16px;font-family:var(--font-body)}
.mono{font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase}
</style></head><body>
<div class="row">
  <div class="line"><span>H2 Section</span><span class="h2">Cinco movimientos.</span></div>
  <div class="line"><span>H3 Card</span><span class="h3">One Arm Handstand</span></div>
  <div class="line"><span>Body</span><span class="body">Entrenamiento estructurado, sin atajos.</span></div>
  <div class="line"><span>Mono / Eyebrow</span><span class="mono">OAH · 01 · ÉLITE</span></div>
</div>
</body></html>
